<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Phim Hay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f17;
    color: #fff;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15, 15, 23, 0.95);
    backdrop-filter: blur(10px);
    padding: 14px 20px;
    border-bottom: 1px solid #1f1f2e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, #ff4d6d, #ff9500);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .search-box {
    flex: 1; max-width: 320px;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px;
    background: #1a1a28;
    border: 1px solid #2a2a3e;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border .2s;
  }
  .search-box input:focus { border-color: #ff4d6d; }/* CONTAINER */
.container { padding: 20px; max-width: 1400px; margin: 0 auto; }

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .container { padding: 12px; }
}

/* CARD */
.card {
  background: #1a1a28;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .25s, box-shadow .25s;
  position: relative;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(255, 77, 109, 0.25);
}
.card-img-wrap {
  position: relative;
  aspect-ratio: 2/3;
  background: #25253a;
  overflow: hidden;
}
.card-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .4s;
  display: block;
}
.card-img-wrap img.loaded { opacity: 1; }
.card-img-wrap::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, #1a1a28 0%, #25253a 50%, #1a1a28 100%);
  background-size: 200% 100%;
  animation: skeleton 1.4s infinite;
  z-index: 1;
}
.card-img-wrap.loaded::before { display: none; }
@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
 }.card-badge {
  position: absolute;
  top: 8px; left: 8px;
  background: rgba(255, 77, 109, 0.9);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  z-index: 2;
}
.card-info { padding: 10px; }
.card-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 34px;
}
.card-meta {
  font-size: 11px;
  color: #888;
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
}
.card-meta .rating { color: #ffb800; font-weight: 600; }

/* LOADER */
.sentinel { height: 40px; margin-top: 20px; }
.loading-more {
  text-align: center;
  padding: 20px;
  color: #888;
  font-size: 14px;
}
.spinner {
  display: inline-block;
  width: 22px; height: 22px;
  border: 3px solid #2a2a3e;
  border-top-color: #ff4d6d;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.end-msg {
  text-align: center;
  padding: 30px;
  color: #555;
  font-size: 14px;
}
.error-box {
  text-align: center;
  padding: 40px 20px;
  color: #ff4d6d;
}
.error-box button {
  margin-top: 16px;
  padding: 10px 24px;
  background: #ff4d6d;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
 }  /* TOP BUTTON */
  #topBtn {
    position: fixed;
    bottom: 24px; right: 24px;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #ff4d6d;
    color: #fff;
    border: none;
    font-size: 20px;
    cursor: pointer;
    display: none;
    box-shadow: 0 4px 16px rgba(255, 77, 109, 0.5);
    z-index: 99;
    transition: transform .2s;
  }
  #topBtn:hover { transform: scale(1.1); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1a1a28;
    border-radius: 16px;
    max-width: 800px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(0,0,0,0.6);
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    z-index: 10;
  }
  .modal-body { display: flex; gap: 20px; padding: 20px; }
  .modal-body img { width: 200px; border-radius: 10px; flex-shrink: 0; }
  .modal-info h2 { margin-bottom: 10px; font-size: 22px; }
  .modal-info p { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
  @media (max-width: 600px) {
    .modal-body { flex-direction: column; }
    .modal-body img { width: 100%; max-width: 220px; margin: 0 auto; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎬 PHIM HAY</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm phim... (Enter để tìm)">
  </div>
</header>

<div class="container">
  <div id="grid" class="grid"></div>
  <div id="sentinel" class="sentinel"></div>
  <div id="status" class="loading-more"></div>
</div>

<button id="topBtn" title="Lên đầu trang">↑</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div><script>
/* ============================================
   CẤU HÌNH API - KKPhim (miễn phí, mở CORS)
============================================ */
const API_LIST   = 'https://phimapi.com/danh-sach/phim-moi-cap-nhat';
const API_SEARCH = 'https://phimapi.com/v1/api/tim-kiem';
const API_DETAIL = 'https://phimapi.com/phim';

/* ============================================
   STATE
============================================ */
let currentPage = 1;
let lastPage = 1;
let isLoading = false;
let hasMore = true;
let allMovies = [];
let keyword = '';
const cache = new Map();

/* ============================================
   HÀM FETCH API
============================================ */
async function fetchMovies(page = 1, search = '') {
  const key = `${page}::${search}`;
  if (cache.has(key)) return cache.get(key);

  let movies = [], curPage = page, totalPages = 1;

  if (search) {
    const url = `${API_SEARCH}?keyword=${encodeURIComponent(search)}&page=${page}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    movies = json?.data?.items || [];
    curPage = json?.data?.pagination?.currentPage || page;
    totalPages = json?.data?.pagination?.totalPages || 1;
  } else {
    const url = `${API_LIST}?page=${page}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    movies = json?.items || [];
    curPage = json?.pagination?.currentPage || page;
    totalPages = json?.pagination?.totalPages || 1;
  }

  const result = { movies, currentPage: curPage, lastPage: totalPages };
  cache.set(key, result);
  return result;
}/* ============================================
   RENDER CARD
============================================ */
function createCard(movie) {
  const card = document.createElement('div');
  card.className = 'card';

  const title   = movie.name || movie.title || 'Không có tên';
  const poster  = movie.poster_url || movie.thumb_url || '';
  const year    = movie.year || '';
  const quality = movie.quality || movie.lang || '';

  card.innerHTML = `
    <div class="card-img-wrap">
      ${quality ? `<div class="card-badge">${quality}</div>` : ''}
      <img alt="${title}" loading="lazy">
    </div>
    <div class="card-info">
      <div class="card-title">${title}</div>
      <div class="card-meta">
        <span>${year}</span>
        <span class="rating">${movie.episode_current || ''}</span>
      </div>
    </div>
  `;

  const img = card.querySelector('img');
  img.onload = () => {
    img.classList.add('loaded');
    img.parentElement.classList.add('loaded');
  };
  img.onerror = () => {
    img.parentElement.classList.add('loaded');
    img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect fill="%2325253a" width="200" height="300"/><text x="50%" y="50%" fill="%23666" font-size="14" text-anchor="middle" dy=".3em">No Image</text></svg>';
  };
  img.src = poster;

  card.onclick = () => openModal(movie);
  return card;
}

/* ============================================
   RENDER GRID
============================================ */
function renderMovies(movies, append = false) {
  const grid = document.getElementById('grid');
  if (!append) grid.innerHTML = '';
  movies.forEach(m => grid.appendChild(createCard(m)));
}/* ============================================
   LOAD TRANG
============================================ */
async function loadPage(page = 1, reset = false) {
  if (isLoading || (!hasMore && !reset)) return;
  isLoading = true;

  const statusEl = document.getElementById('status');
  if (reset) {
    currentPage = 1;
    hasMore = true;
    allMovies = [];
    document.getElementById('grid').innerHTML = '';
  }

  statusEl.innerHTML = '<span class="spinner"></span>Đang tải...';

  try {
    const data = await fetchMovies(page, keyword);
    const movies = data.movies || [];

    if (movies.length === 0 && page === 1) {
      statusEl.innerHTML = `
        <div class="error-box">
          ⚠️ Không tìm thấy phim nào.<br>
          <small style="color:#888">Thử từ khóa khác hoặc tải lại trang.</small>
        </div>`;
      hasMore = false;
      isLoading = false;
      return;
    }

    renderMovies(movies, !reset);
    allMovies = allMovies.concat(movies);

    lastPage = data.lastPage || 1;
    currentPage = data.currentPage || page;

    if (currentPage >= lastPage || movies.length === 0) {
      hasMore = false;
      statusEl.innerHTML = `<div class="end-msg">— Đã hiển thị tất cả ${allMovies.length} phim —</div>`;
    } else {
      statusEl.innerHTML = '';
    }
  } catch (err) {
    console.error(err);
    statusEl.innerHTML = `
      <div class="error-box">
        ❌ Lỗi tải dữ liệu: ${err.message}
        <br><button onclick="retry()">Thử lại</button>
      </div>`;
  } finally {
    isLoading = false;
  }
}

function retry() {
  hasMore = true;
  loadPage(currentPage + 1, false);
}/* ============================================
   INFINITE SCROLL
============================================ */
const sentinel = document.getElementById('sentinel');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && hasMore && !isLoading) {
      loadPage(currentPage + 1, false);
    }
  });
}, { rootMargin: '300px' });
observer.observe(sentinel);

/* ============================================
   SEARCH
============================================ */
const searchInput = document.getElementById('searchInput');
let searchTimeout;

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    clearTimeout(searchTimeout);
    keyword = searchInput.value.trim();
    loadPage(1, true);
  }
});

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    const val = searchInput.value.trim();
    if (val !== keyword) {
      keyword = val;
      loadPage(1, true);
    }
  }, 600);
});/* ============================================
   MODAL CHI TIẾT
============================================ */
async function openModal(movie) {
  const overlay = document.getElementById('modal');
  const body = document.getElementById('modalBody');
  overlay.classList.add('show');

  const title  = movie.name || movie.title || 'Không có tên';
  const poster = movie.poster_url || movie.thumb_url || '';
  const year   = movie.year || '—';

  body.innerHTML = `
    <img src="${poster}" alt="${title}">
    <div class="modal-info">
      <h2>${title}</h2>
      <p><strong>Năm:</strong> ${year}</p>
      <p><span class="spinner"></span>Đang tải chi tiết...</p>
    </div>
  `;

  if (!movie.slug) return;

  try {
    const res = await fetch(`${API_DETAIL}/${movie.slug}`);
    const json = await res.json();
    const m = json?.movie || {};
    const desc = (m.content || '').replace(/<[^>]+>/g, '').slice(0, 600) || 'Chưa có mô tả.';
    const actor = (m.actor || []).slice(0, 6).join(', ') || '—';
    const director = (m.director || []).join(', ') || '—';
    const country = (m.country || []).map(c => c.name).join(', ') || '—';
    const category = (m.category || []).map(c => c.name).join(', ') || '—';

    body.innerHTML = `
      <img src="${poster}" alt="${title}">
      <div class="modal-info">
        <h2>${title}</h2>
        <p><strong>Năm:</strong> ${year}</p>
        <p><strong>Thể loại:</strong> ${category}</p>
        <p><strong>Quốc gia:</strong> ${country}</p>
        <p><strong>Đạo diễn:</strong> ${director}</p>
        <p><strong>Diễn viên:</strong> ${actor}</p>
        <p style="margin-top:12px">${desc}...</p>
      </div>
    `;
  } catch (e) {
    console.error(e);
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============================================
   BACK TO TOP
============================================ */
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  topBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
});
topBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });/* ============================================
   KHỞI ĐỘNG
============================================ */
console.log('🚀 Web phim KKPhim đang chạy...');
loadPage(1, true);
</script>

</body>
</html>
