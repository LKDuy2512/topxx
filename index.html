/* ============================================
   CU HÌNH
============================================ */
const API_BASE = 'https://topxx.vip/api/v1/movies/latest';
const PER_PAGE = 12;
const PER_PAGE_INDEX = 30;
const PROXY_TIMEOUT = 6000;      // 6s
const CACHE_TTL = 5 * 60 * 1000;
const INDEX_TTL = 30 * 60 * 1000;
const HISTORY_MAX = 24;

/*  Danh sách proxy — s c RACE song song */
const PROXIES = [
  { name: 'direct',  fn: (url) => url },
  { name: 'corsproxy', fn: (url) => `https://corsproxy.io/?${encodeURIComponent(url)}` },
  { name: 'allorigins', fn: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` },
  { name: 'codetabs', fn: (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}` },
  { name: 'cors-eu', fn: (url) => `https://cors.eu.org/${url}` }
];

/* ============================================
   STATE
============================================ */
let currentPage = 1;
let lastPage = 1;
let isLoading = false;
let hasMore = true;
let allMovies = [];
let keyword = '';
let searchMode = false;
let currentView = 'home';
const cache = new Map();

/* Nh proxy nhanh nht */
let fastestProxyName = localStorage.getItem('fastestProxy') || 'direct';

/*  MOVIE INDEX */
let movieIndex = [];
let indexReady = false;
let indexPromise = null;

/* ============================================
   HELPERS
============================================ */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function lsGet(key) {
  try {
    const raw = localStorage.getItem('movieCache::' + key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.t > CACHE_TTL) {
      localStorage.removeItem('movieCache::' + key);
      return null;
    }
    return obj.v;
  } catch { return null; }
}
function lsSet(key, value) {
  try {
    localStorage.setItem('movieCache::' + key, JSON.stringify({ t: Date.now(), v: value }));
  } catch {}
}

/* ============================================
   FETCH 1 PROXY
============================================ */
async function fetchViaProxy(proxyFn, targetUrl, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(proxyFn(targetUrl), {
      headers: { 'Accept': 'application/json' },
      signal: ctrl.signal
    });
    if (res.status === 429) {
      const e = new Error('429');
      e.isRateLimit = true;
      throw e;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json || typeof json !== 'object') throw new Error('Not JSON');
    if (json.error) throw new Error(json.error);
    return json;
  } finally {
    clearTimeout(timer);
  }
}

/* ============================================
    RACE PROXY — th song song, cái nào tr li trc thì dùng
============================================ */
async function raceProxy(targetUrl, timeout = PROXY_TIMEOUT) {
  // Sp xp: proxy nhanh nht lên u ( u tiên), nhng vn RACE
  const sorted = [...PROXIES].sort((a, b) => {
    if (a.name === fastestProxyName) return -1;
    if (b.name === fastestProxyName) return 1;
    return 0;
  });

  return new Promise((resolve, reject) => {
    let pending = sorted.length;
    let settled = false;
    const errors = [];

    sorted.forEach(proxy => {
      fetchViaProxy(proxy.fn, targetUrl, timeout)
        .then(json => {
          if (settled) return;
          settled = true;
          fastestProxyName = proxy.name;
          localStorage.setItem('fastestProxy', proxy.name);
          console.log(` Proxy thng: ${proxy.name}`);
          resolve(json);
        })
        .catch(err => {
          errors.push(`${proxy.name}: ${err.message}`);
          pending--;
          if (pending === 0 && !settled) {
            settled = true;
            reject(new Error('Tt c proxy fail: ' + errors.join(' | ')));
          }
        });
    });
  });
}

/* ============================================
   FETCH 1 PAGE
============================================ */
async function fetchOnePage(page, perPage = PER_PAGE) {
  const key = `page::${page}::${perPage}`;
  const cached = lsGet(key);
  if (cached) {
    console.log(` Cache page ${page}`);
    return cached;
  }

  const params = new URLSearchParams({ page, per_page: perPage });
  const targetUrl = `${API_BASE}?${params.toString()}`;

  const json = await raceProxy(targetUrl);
  const movies = Array.isArray(json?.data) ? json.data : [];
  const meta = json?.meta || {};
  const links = json?.links || {};

  const result = {
    movies,
    currentPage: meta.current_page || page,
    lastPage: meta.last_page || (links.next ? page + 1 : page),
    total: meta.total || 0,
    hasNext: !!links.next
  };
  lsSet(key, result);
  return result;
}

async function fetchMovies(page = 1, search = '') {
  return await fetchOnePage(page, PER_PAGE);
}

/* ============================================
    BUILD INDEX (chm rãi, tránh 429)
============================================ */
async function buildIndex() {
  if (indexPromise) return indexPromise;

  indexPromise = (async () => {
    try {
      const raw = localStorage.getItem('movieIndex');
      if (raw) {
        const obj = JSON.parse(raw);
        if (Date.now() - obj.t < INDEX_TTL && Array.isArray(obj.v) && obj.v.length > 0) {
          movieIndex = obj.v;
          indexReady = true;
          console.log(' Index t cache:', movieIndex.length);
          return;
        }
      }
    } catch {}

    const seen = new Set();
    const all = [];
    allMovies.forEach(m => {
      if (m.code && !seen.has(m.code)) { seen.add(m.code); all.push(m); }
    });

    const first = await fetchOnePage(1, PER_PAGE_INDEX);
    const totalPages = Math.min(first.lastPage || 1, 20);

    (first.movies || []).forEach(m => {
      if (m.code && !seen.has(m.code)) { seen.add(m.code); all.push(m); }
    });

    const CONCURRENCY = 2;
    const pages = [];
    for (let i = 2; i <= totalPages; i++) pages.push(i);

    for (let i = 0; i < pages.length; i += CONCURRENCY) {
      const batch = pages.slice(i, i + CONCURRENCY);
      const results = await Promise.all(
        batch.map(p => fetchOnePage(p, PER_PAGE_INDEX).catch(() => ({ movies: [] })))
      );
      results.forEach(r => {
        (r.movies || []).forEach(m => {
          if (m.code && !seen.has(m.code)) { seen.add(m.code); all.push(m); }
        });
      });
      if (i + CONCURRENCY < pages.length) await sleep(400);
    }

    movieIndex = all;
    indexReady = true;
    try {
      localStorage.setItem('movieIndex', JSON.stringify({ t: Date.now(), v: movieIndex }));
    } catch {}
    console.log(' Index sn sàng:', movieIndex.length);
  })();

  return indexPromise;
}

function addToIndex(movies) {
  if (!Array.isArray(movies)) return;
  const existing = new Set(movieIndex.map(m => m.code));
  movies.forEach(m => {
    if (m.code && !existing.has(m.code)) {
      movieIndex.push(m);
      existing.add(m.code);
    }
  });
}/* ============================================
   SKELETON
============================================ */
function renderSkeleton(count = 8) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const card = document.createElement('div');

      <div class="card-info">

        <div style="height:14px;width:60%;background:#25253a;border-radius:4px"></div>
      </div>`;
    frag.appendChild(card);
  }
  grid.appendChild(frag);
}

/* ============================================
   CREATE CARD
============================================ */
function createCard(movie) {
  const card = document.createElement('div');
  card.className = 'card';

  const trans    = movie.trans?.[0] || {};
  const title    = trans.title || movie.code || 'Không có tên';
  const poster   = movie.thumbnail || '';
  const quality  = movie.quality || '';
  const duration = movie.duration || '';

  card.innerHTML = `
    <div class="card-img-wrap">
      ${quality ? `<div class="card-badge">${quality}</div>` : ''}
      <img alt="${title}" loading="lazy" decoding="async">
    </div>
    <div class="card-info">
      <div class="card-title">${title}</div>
      <div class="card-meta">
        <span>${duration}</span>
        <span class="duration">${quality}</span>
      </div>
    </div>
  `;

  const img = card.querySelector('img');
  img.onload = () => {
    img.classList.add('loaded');
    img.parentElement.classList.add('loaded');
  };
  img.onerror = () => {
    img.parentElement.classList.add('loaded');
    img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect fill="%2325253a" width="200" height="300"/><text x="50%" y="50%" fill="%23666" font-size="14" text-anchor="middle" dy=".3em">No Image</text></svg>';
  };
  img.src = poster;

  card.onclick = () => openModal(movie);
  return card;
}

function renderMovies(movies, append = false) {
  const grid = document.getElementById('grid');
  if (!append) grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  movies.forEach(m => frag.appendChild(createCard(m)));
  grid.appendChild(frag);
}

/* ============================================
   LCH S XEM
============================================ */
function getHistory() {
  try { return JSON.parse(localStorage.getItem('watchHistory') || '[]'); }
  catch { return []; }
}
function saveHistory(movie) {
  const trans = movie.trans?.[0] || {};
  const entry = {
    code: movie.code,
    title: trans.title || movie.code,
    thumbnail: movie.thumbnail || '',
    quality: movie.quality || '',
    duration: movie.duration || '',
    trans: movie.trans, genres: movie.genres, sources: movie.sources,
    viewedAt: Date.now()
  };
  let list = getHistory();
  list = list.filter(m => m.code !== entry.code);
  list.unshift(entry);
  list = list.slice(0, HISTORY_MAX);
  try { localStorage.setItem('watchHistory', JSON.stringify(list)); } catch {}
  updateHistoryBadge();
}
function updateHistoryBadge() {
  const count = getHistory().length;
  const badge = document.getElementById('historyBadge');
  badge.textContent = count;
  badge.setAttribute('data-count', count);
}
function renderHistory() {
  const list = getHistory();
  const grid = document.getElementById('historyGrid');
  grid.innerHTML = '';
  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon"></div>
        <h3>Cha có lch s xem</h3>
        <p>Nhng phim bn xem s xut hin  ây.</p>
      </div>`;
    updateHistoryBadge();
    return;
  }
  const frag = document.createDocumentFragment();
  list.forEach(m => frag.appendChild(createCard(m)));
  grid.appendChild(frag);
  updateHistoryBadge();
}
function clearHistory() {
  if (!confirm('Xóa toàn b lch s xem?')) return;
  localStorage.removeItem('watchHistory');
  renderHistory();
}

/* ============================================
   SWITCH VIEW
============================================ */
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.view === view);
  });
  const homeView = document.getElementById('homeView');
  const historyView = document.getElementById('historyView');
  const searchBox = document.getElementById('searchBox');
  if (view === 'history') {
    homeView.classList.add('hide');
    historyView.classList.add('show');
    searchBox.style.display = 'none';
    renderHistory();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    historyView.classList.remove('show');
    homeView.classList.remove('hide');
    searchBox.style.display = '';
  }
}/* ============================================
   LOAD TRANG
============================================ */
async function loadPage(page = 1, reset = false) {
  if (isLoading || (!hasMore && !reset)) return;
  isLoading = true;

  const statusEl = document.getElementById('status');
  if (reset) {
    currentPage = 1;
    hasMore = true;
    allMovies = [];
    if (!searchMode) renderSkeleton(8);
  }

  statusEl.innerHTML = '<span class="spinner"></span>ang ti...';

  try {
    const data = await fetchMovies(page, keyword);
    const movies = data.movies || [];

    if (movies.length === 0 && page === 1 && !searchMode) {
      statusEl.innerHTML = `
        <div class="error-box">
           Không có phim nào.<br>
          <small style="color:#888">Th t khóa khác hoc ti li trang.</small>
        </div>`;
      hasMore = false;
      isLoading = false;
      return;
    }

    renderMovies(movies, !reset);
    allMovies = allMovies.concat(movies);
    addToIndex(movies);

    lastPage = data.lastPage || 1;
    currentPage = data.currentPage || page;

    if (!data.hasNext || currentPage >= lastPage || movies.length === 0) {
      hasMore = false;
      statusEl.innerHTML = `<div class="end-msg">— ã hin th ${allMovies.length} phim —</div>`;
    } else {
      statusEl.innerHTML = '';
      //  Prefetch trang k tip (background, không ch)
      setTimeout(() => {
        fetchOnePage(currentPage + 1).catch(() => {});
      }, 1500);
    }
  } catch (err) {
    console.error(err);

    if (err.message && err.message.includes('429')) {
      statusEl.innerHTML = `
        <div class="error-box">
           Máy ch gii hn, i 5s...
        </div>`;
      setTimeout(() => {
        isLoading = false;
        loadPage(page, false);
      }, 5000);
      return;
    }

    statusEl.innerHTML = `
      <div class="error-box">
         Li ti d liu: ${err.message}
        <br><button onclick="retry()">Th li</button>
      </div>`;
  } finally {
    isLoading = false;
  }
}

function retry() {
  hasMore = true;
  loadPage(currentPage + 1, false);
}

/* ============================================
    SEARCH LOCAL
============================================ */
function normalize(str) {
  return (str || '').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[]/g, 'd').toLowerCase().trim();
}

function searchLocal(kw) {
  const needle = normalize(kw);
  if (!needle) return [];
  const results = [];
  for (const m of movieIndex) {
    const trans = m.trans?.[0] || {};
    const title = normalize(trans.title || '');
    const slug = normalize(trans.slug || '');
    const code = normalize(m.code || '');
    if (title.includes(needle) || slug.includes(needle) || code.includes(needle)) {
      results.push(m); continue;
    }
    const words = title.split(/\s+/);
    if (words.some(w => w.includes(needle) || needle.includes(w))) results.push(m);
  }
  return results;
}

async function doSearch(kw) {
  kw = kw.trim();
  if (!kw) { clearSearch(); return; }
  if (currentView !== 'home') switchView('home');

  keyword = kw;
  searchMode = true;
  hasMore = false;

  const statusEl = document.getElementById('status');
  const searchInfo = document.getElementById('searchInfo');
  const grid = document.getElementById('grid');

  searchInfo.classList.add('show');
  document.getElementById('searchKeyword').textContent = kw;
  document.getElementById('searchCount').textContent = '...';
  grid.innerHTML = '';

  if (!indexReady) {
    renderSkeleton(8);
    statusEl.innerHTML = '<span class="spinner"></span>ang ti danh sách phim...';
    try {
      await buildIndex();
    } catch (e) {
      statusEl.innerHTML = `
        <div class="error-box">
           Không ti c danh sách: ${e.message}
          <br><button onclick="doSearch('${kw.replace(/'/g, "\\'")}')">Th li</button>
        </div>`;
      return;
    }
  }

  grid.innerHTML = '';
  const results = searchLocal(kw);

  if (results.length === 0) {
    statusEl.innerHTML = `
      <div class="error-box">
         Không tìm thy "<b>${kw}</b>"
        <br><small style="color:#888">Th t khóa khác</small>
      </div>`;
    document.getElementById('searchCount').textContent = '0';
  } else {
    renderMovies(results, false);
    document.getElementById('searchCount').textContent = results.length;
    statusEl.innerHTML = `<div class="end-msg">— ${results.length} kt qu (t ${movieIndex.length} phim) —</div>`;
  }
}

function clearSearch() {
  keyword = '';
  searchMode = false;
  document.getElementById('searchInput').value = '';
  document.getElementById('searchBox').classList.remove('has-value');
  document.getElementById('searchInfo').classList.remove('show');
  hasMore = true;
  loadPage(1, true);
}/* ============================================
   INFINITE SCROLL
============================================ */
const sentinel = document.getElementById('sentinel');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting
        && hasMore && !isLoading
        && !searchMode
        && currentView === 'home') {
      loadPage(currentPage + 1, false);
    }
  });
}, { rootMargin: '300px' });
observer.observe(sentinel);

/* ============================================
   SEARCH INPUT
============================================ */
const searchInput = document.getElementById('searchInput');
const searchBox = document.getElementById('searchBox');
const clearBtn = document.getElementById('clearBtn');
let searchTimeout;

searchInput.addEventListener('input', () => {
  const val = searchInput.value.trim();
  searchBox.classList.toggle('has-value', val.length > 0);
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    if (val.length >= 1) doSearch(val);
    else if (val.length === 0 && searchMode) clearSearch();
  }, 250);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(searchTimeout);
    const val = searchInput.value.trim();
    if (val) doSearch(val);
  }
  if (e.key === 'Escape') clearSearch();
});

clearBtn.addEventListener('click', clearSearch);/* ============================================
   MODAL + PLAYER
============================================ */
let currentMovie = null;
let currentSourceIndex = 0;
let iframeLoadTimer = null;

function openModal(movie) {
  currentMovie = movie;
  currentSourceIndex = 0;
  saveHistory(movie);
  document.querySelector('.modal').classList.add('wide');
  renderPlayer();
  document.getElementById('modal').classList.add('show');
}

function renderPlayer() {
  const movie = currentMovie;
  if (!movie) return;
  const trans = movie.trans?.[0] || {};
  const title = trans.title || movie.code || 'Không có tên';
  const desc = trans.description || 'Cha có mô t.';
  const quality = movie.quality || '—';
  const duration = movie.duration || '—';
  const genres = (movie.genres || [])
    .map(g => g.trans?.[0]?.name).filter(Boolean).join(', ') || '—';

  const sources = movie.sources || [];
  const body = document.getElementById('modalBody');

  if (sources.length === 0) {
    body.innerHTML = `
      <div class="modal-info-wrap" style="padding:40px 20px;text-align:center">
        <h2>${title}</h2>
        <p style="margin-top:16px">${desc}</p>
        <p style="color:#ff4d6d;margin-top:16px"> Phim này cha có ngun phát.</p>
      </div>`;
    return;
  }

  const tabsHtml = sources.length > 1 ? `
    <div class="source-tabs">
      <span class="tab-label">Server:</span>
      ${sources.map((s, i) => `
        <button class="source-tab ${i === currentSourceIndex ? 'active' : ''}"
                onclick="switchSource(${i})">
          ${s.type || 'Server ' + (i + 1)}
        </button>`).join('')}
    </div>` : '';

  const currentSource = sources[currentSourceIndex] || sources[0];
  const embedUrl = currentSource.link || '';

  body.innerHTML = `
    <div class="modal-player" id="playerWrap">
      <iframe id="playerFrame" src="${embedUrl}"
              allowfullscreen
              allow="autoplay; encrypted-media; picture-in-picture"
              referrerpolicy="no-referrer" loading="lazy"></iframe>
    </div>
    ${tabsHtml}
    <div class="modal-info-wrap">
      <h2>${title}</h2>
      <p><strong>Cht lng:</strong> ${quality} · <strong>Thi lng:</strong> ${duration}</p>
      <p><strong>Th loi:</strong> ${genres}</p>
      <p style="margin-top:10px">${desc}</p>
    </div>`;

  startIframeWatchdog(embedUrl);
}

function startIframeWatchdog(embedUrl) {
  clearTimeout(iframeLoadTimer);
  let loaded = false;
  const frame = document.getElementById('playerFrame');
  if (frame) frame.addEventListener('load', () => { loaded = true; });
  iframeLoadTimer = setTimeout(() => {
    if (loaded) return;
    const wrap = document.getElementById('playerWrap');
    if (!wrap) return;
    wrap.outerHTML = `
      <div class="player-fallback">
        <div class="icon"></div>
        <h3>Không th nhúng player</h3>
        <p>Server chn iframe. Nhn nút  xem tab mi.</p>
        <a class="btn-open" href="${embedUrl}" target="_blank" rel="noopener"> M trong tab mi</a>
      </div>`;
  }, 3500);
}

function switchSource(index) {
  currentSourceIndex = index;
  document.querySelectorAll('.source-tab').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  renderPlayer();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  clearTimeout(iframeLoadTimer);
  const body = document.getElementById('modalBody');
  setTimeout(() => { body.innerHTML = ''; }, 250);
  document.querySelector('.modal').classList.remove('wide');
  if (currentView === 'history') renderHistory();
}

document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
