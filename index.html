    <div class="modal-body" id="modalBody"></div>

</div><script>
/* ============================================
   CẤU HÌNH
============================================ */
const API_BASE = 'https://topxx.vip/api/v1/movies/latest';
const PER_PAGE = 12;
const PROXY_TIMEOUT = 6000;
const CACHE_TTL = 5 * 60 * 1000;
const SEARCH_PAGES = 5;
const HISTORY_MAX = 24;

const PROXIES = [
  (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://cors.eu.org/${url}`,
  (url) => url
];

/* ============================================
   STATE
============================================ */
let currentPage = 1;
let lastPage = 1;
let isLoading = false;
let hasMore = true;
let allMovies = [];
let keyword = '';
let searchMode = false;
let currentView = 'home';   // 'home' | 'history'
const cache = new Map();

let workingProxyIdx = parseInt(localStorage.getItem('workingProxyIdx') ?? '-1');

/* ============================================
   CACHE LOCALSTORAGE
============================================ */
function lsGet(key) {
  try {
    const raw = localStorage.getItem('movieCache::' + key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.t > CACHE_TTL) {
      localStorage.removeItem('movieCache::' + key);
      return null;
    }
    return obj.v;
  } catch { return null; }
}
function lsSet(key, value) {
  try {
    localStorage.setItem('movieCache::' + key, JSON.stringify({ t: Date.now(), v: value }));
  } catch {}
}

/* ============================================
   FETCH VỚI TIMEOUT
============================================ */
async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, {
      headers: { 'Accept': 'application/json' },
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ============================================
   FETCH 1 PAGE
============================================ */
async function fetchOnePage(page) {
  const key = `page::${page}`;
  const cached = lsGet(key);
  if (cached) return cached;

  const params = new URLSearchParams({ page, per_page: PER_PAGE });
  const targetUrl = `${API_BASE}?${params.toString()}`;

  let proxiesToTry;
  if (workingProxyIdx >= 0 && workingProxyIdx < PROXIES.length) {
    proxiesToTry = [
      { fn: PROXIES[workingProxyIdx], idx: workingProxyIdx },
      ...PROXIES.map((fn, i) => ({ fn, idx: i })).filter(p => p.idx !== workingProxyIdx)
    ];
  } else {
    proxiesToTry = PROXIES.map((fn, i) => ({ fn, idx: i }));
  }

  let lastErr = null;
  for (const { fn, idx } of proxiesToTry) {
    const url = fn(targetUrl);
    try {
      const json = await fetchWithTimeout(url, PROXY_TIMEOUT);
      if (!json || typeof json !== 'object') throw new Error('Not JSON');
      if (json.error) throw new Error(json.error);

      workingProxyIdx = idx;
      localStorage.setItem('workingProxyIdx', idx);

      const movies = Array.isArray(json?.data) ? json.data : [];
      const meta = json?.meta || {};
      const links = json?.links || {};

      const result = {
        movies,
        currentPage: meta.current_page || page,
        lastPage: meta.last_page || (links.next ? page + 1 : page),
        total: meta.total || 0,
        hasNext: !!links.next
      };
      lsSet(key, result);
      return result;
    } catch (err) {
      lastErr = err;
      if (idx === workingProxyIdx) {
        workingProxyIdx = -1;
        localStorage.removeItem('workingProxyIdx');
      }
    }
  }
  throw lastErr || new Error('Tất cả proxy đều thất bại');
}

async function fetchMovies(page = 1, search = '') {
  return await fetchOnePage(page);
}

/* ============================================
   SEARCH CLIENT-SIDE
============================================ */
async function searchMovies(kw) {
  const needle = kw.toLowerCase().trim();
  if (!needle) return [];

  console.log(`🔍 Đang tải ${SEARCH_PAGES} trang để tìm "${kw}"...`);

  const promises = [];
  for (let i = 1; i <= SEARCH_PAGES; i++) {
    promises.push(fetchOnePage(i).catch(() => ({ movies: [] })));
  }
  const results = await Promise.all(promises);

  const all = [];
  const seen = new Set();
  results.forEach(r => {
    (r.movies || []).forEach(m => {
      const code = m.code || m.trans?.[0]?.slug;
      if (!code || seen.has(code)) return;
      seen.add(code);

      const title = (m.trans?.[0]?.title || m.code || '').toLowerCase();
      if (title.includes(needle)) all.push(m);
    });
  });

  console.log(`✅ Tìm thấy ${all.length} phim khớp`);
  return all;
}/* ============================================
   SKELETON
============================================ */
function renderSkeleton(count = 8) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-img-wrap"></div>
      <div class="card-info">
        <div style="height:14px;background:#25253a;border-radius:4px;margin-bottom:6px"></div>
        <div style="height:14px;width:60%;background:#25253a;border-radius:4px"></div>
      </div>`;
    frag.appendChild(card);
  }
  grid.appendChild(frag);
}

/* ============================================
   CREATE CARD
============================================ */
function createCard(movie) {
  const card = document.createElement('div');
  card.className = 'card';

  const trans    = movie.trans?.[0] || {};
  const title    = trans.title || movie.code || 'Không có tên';
  const poster   = movie.thumbnail || '';
  const quality  = movie.quality || '';
  const duration = movie.duration || '';

  card.innerHTML = `
    <div class="card-img-wrap">
      ${quality ? `<div class="card-badge">${quality}</div>` : ''}
      <img alt="${title}" loading="lazy" decoding="async">
    </div>
    <div class="card-info">
      <div class="card-title">${title}</div>
      <div class="card-meta">
        <span>${duration}</span>
        <span class="duration">${quality}</span>
      </div>
    </div>
  `;

  const img = card.querySelector('img');
  img.onload = () => {
    img.classList.add('loaded');
    img.parentElement.classList.add('loaded');
  };
  img.onerror = () => {
    img.parentElement.classList.add('loaded');
    img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect fill="%2325253a" width="200" height="300"/><text x="50%" y="50%" fill="%23666" font-size="14" text-anchor="middle" dy=".3em">No Image</text></svg>';
  };
  img.src = poster;

  card.onclick = () => openModal(movie);
  return card;
}

function renderMovies(movies, append = false) {
  const grid = document.getElementById('grid');
  if (!append) grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  movies.forEach(m => frag.appendChild(createCard(m)));
  grid.appendChild(frag);
}

/* ============================================
   LỊCH SỬ XEM
============================================ */
function getHistory() {
  try {
    return JSON.parse(localStorage.getItem('watchHistory') || '[]');
  } catch { return []; }
}

function saveHistory(movie) {
  const trans = movie.trans?.[0] || {};
  const entry = {
    code: movie.code,
    title: trans.title || movie.code,
    thumbnail: movie.thumbnail || '',
    quality: movie.quality || '',
    duration: movie.duration || '',
    trans: movie.trans,
    genres: movie.genres,
    sources: movie.sources,
    viewedAt: Date.now()
  };
  let list = getHistory();
  list = list.filter(m => m.code !== entry.code);
  list.unshift(entry);
  list = list.slice(0, HISTORY_MAX);
  try {
    localStorage.setItem('watchHistory', JSON.stringify(list));
  } catch {}
  updateHistoryBadge();
}

function updateHistoryBadge() {
  const count = getHistory().length;
  const badge = document.getElementById('historyBadge');
  badge.textContent = count;
  badge.setAttribute('data-count', count);
}

function renderHistory() {
  const list = getHistory();
  const grid = document.getElementById('historyGrid');
  grid.innerHTML = '';

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon">🕒</div>
        <h3>Chưa có lịch sử xem</h3>
        <p>Những phim bạn xem sẽ xuất hiện ở đây.</p>
      </div>`;
    updateHistoryBadge();
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach(m => frag.appendChild(createCard(m)));
  grid.appendChild(frag);
  updateHistoryBadge();
}

function clearHistory() {
  if (!confirm('Xóa toàn bộ lịch sử xem?')) return;
  localStorage.removeItem('watchHistory');
  renderHistory();
}

/* ============================================
   SWITCH VIEW (Trang chủ <-> Lịch sử)
============================================ */
function switchView(view) {
  currentView = view;

  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.view === view);
  });

  const homeView = document.getElementById('homeView');
  const historyView = document.getElementById('historyView');
  const searchBox = document.getElementById('searchBox');

  if (view === 'history') {
    homeView.classList.add('hide');
    historyView.classList.add('show');
    searchBox.style.display = 'none';
    renderHistory();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    historyView.classList.remove('show');
    homeView.classList.remove('hide');
    searchBox.style.display = '';
  }
}/* ============================================
   LOAD TRANG
============================================ */
async function loadPage(page = 1, reset = false) {
  if (isLoading || (!hasMore && !reset)) return;
  isLoading = true;

  const statusEl = document.getElementById('status');
  if (reset) {
    currentPage = 1;
    hasMore = true;
    allMovies = [];
    if (!searchMode) renderSkeleton(8);
  }

  statusEl.innerHTML = '<span class="spinner"></span>Đang tải...';

  try {
    const data = await fetchMovies(page, keyword);
    const movies = data.movies || [];

    if (movies.length === 0 && page === 1 && !searchMode) {
      statusEl.innerHTML = `
        <div class="error-box">
          ⚠️ Không có phim nào.<br>
          <small style="color:#888">Thử từ khóa khác hoặc tải lại trang.</small>
        </div>`;
      hasMore = false;
      isLoading = false;
      return;
    }

    renderMovies(movies, !reset);
    allMovies = allMovies.concat(movies);

    lastPage = data.lastPage || 1;
    currentPage = data.currentPage || page;

    if (!data.hasNext || currentPage >= lastPage || movies.length === 0) {
      hasMore = false;
      statusEl.innerHTML = `<div class="end-msg">— Đã hiển thị ${allMovies.length} phim —</div>`;
    } else {
      statusEl.innerHTML = '';
    }
  } catch (err) {
    console.error(err);
    statusEl.innerHTML = `
      <div class="error-box">
        ❌ Lỗi tải dữ liệu: ${err.message}
        <br><button onclick="retry()">Thử lại</button>
      </div>`;
  } finally {
    isLoading = false;
  }
}

function retry() {
  hasMore = true;
  loadPage(currentPage + 1, false);
}

/* ============================================
   TÌM KIẾM (CLIENT-SIDE)
============================================ */
async function doSearch(kw) {
  kw = kw.trim();
  if (!kw) { clearSearch(); return; }

  // Nếu đang ở view lịch sử thì quay về trang chủ
  if (currentView !== 'home') switchView('home');

  keyword = kw;
  searchMode = true;
  isLoading = true;
  hasMore = false;

  const statusEl = document.getElementById('status');
  const searchInfo = document.getElementById('searchInfo');
  const grid = document.getElementById('grid');

  searchInfo.classList.add('show');
  document.getElementById('searchKeyword').textContent = kw;
  document.getElementById('searchCount').textContent = '...';

  grid.innerHTML = '';
  renderSkeleton(8);
  statusEl.innerHTML = '<span class="spinner"></span>Đang tìm kiếm...';

  try {
    const results = await searchMovies(kw);
    grid.innerHTML = '';

    if (results.length === 0) {
      statusEl.innerHTML = `
        <div class="error-box">
          🔍 Không tìm thấy phim nào khớp "<b>${kw}</b>"
          <br><small style="color:#888">Thử từ khóa ngắn hơn (VD: "thiên", "game")</small>
        </div>`;
      document.getElementById('searchCount').textContent = '0';
    } else {
      renderMovies(results, false);
      document.getElementById('searchCount').textContent = results.length;
      statusEl.innerHTML = `<div class="end-msg">— ${results.length} kết quả —</div>`;
    }
  } catch (err) {
    console.error(err);
    grid.innerHTML = '';
    statusEl.innerHTML = `
      <div class="error-box">
        ❌ Lỗi tìm kiếm: ${err.message}
        <br><button onclick="doSearch('${kw.replace(/'/g, "\\'")}')">Thử lại</button>
      </div>`;
  } finally {
    isLoading = false;
  }
}

function clearSearch() {
  keyword = '';
  searchMode = false;
  document.getElementById('searchInput').value = '';
  document.getElementById('searchBox').classList.remove('has-value');
  document.getElementById('searchInfo').classList.remove('show');
  hasMore = true;
  loadPage(1, true);
}/* ============================================
   INFINITE SCROLL
============================================ */
const sentinel = document.getElementById('sentinel');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting
        && hasMore
        && !isLoading
        && !searchMode
        && currentView === 'home') {
      loadPage(currentPage + 1, false);
    }
  });
}, { rootMargin: '300px' });
observer.observe(sentinel);

/* ============================================
   SEARCH INPUT
============================================ */
const searchInput = document.getElementById('searchInput');
const searchBox = document.getElementById('searchBox');
const clearBtn = document.getElementById('clearBtn');
let searchTimeout;

searchInput.addEventListener('input', () => {
  const val = searchInput.value.trim();
  searchBox.classList.toggle('has-value', val.length > 0);

  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    if (val.length >= 2) {
      doSearch(val);
    } else if (val.length === 0 && searchMode) {
      clearSearch();
    }
  }, 800);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(searchTimeout);
    const val = searchInput.value.trim();
    if (val) doSearch(val);
  }
  if (e.key === 'Escape') {
    clearSearch();
  }
});

clearBtn.addEventListener('click', clearSearch);/* ============================================
   MODAL + PLAYER
============================================ */
let currentMovie = null;
let currentSourceIndex = 0;
let iframeLoadTimer = null;

function openModal(movie) {
  currentMovie = movie;
  currentSourceIndex = 0;

  // LƯU LỊCH SỬ
  saveHistory(movie);

  document.querySelector('.modal').classList.add('wide');
  renderPlayer();
  document.getElementById('modal').classList.add('show');
}

function renderPlayer() {
  const movie = currentMovie;
  if (!movie) return;

  const trans = movie.trans?.[0] || {};
  const title = trans.title || movie.code || 'Không có tên';
  const desc = trans.description || 'Chưa có mô tả.';
  const quality = movie.quality || '—';
  const duration = movie.duration || '—';
  const genres = (movie.genres || [])
    .map(g => g.trans?.[0]?.name)
    .filter(Boolean).join(', ') || '—';

  const sources = movie.sources || [];
  const body = document.getElementById('modalBody');

  if (sources.length === 0) {
    body.innerHTML = `
      <div class="modal-info-wrap" style="padding:40px 20px;text-align:center">
        <h2>${title}</h2>
        <p style="margin-top:16px">${desc}</p>
        <p style="color:#ff4d6d;margin-top:16px">⚠️ Phim này chưa có nguồn phát.</p>
      </div>`;
    return;
  }

  const tabsHtml = sources.length > 1 ? `
    <div class="source-tabs">
      <span class="tab-label">Server:</span>
      ${sources.map((s, i) => `
        <button class="source-tab ${i === currentSourceIndex ? 'active' : ''}"
                onclick="switchSource(${i})">
          ${s.type || 'Server ' + (i + 1)}
        </button>`).join('')}
    </div>` : '';

  const currentSource = sources[currentSourceIndex] || sources[0];
  const embedUrl = currentSource.link || '';

  body.innerHTML = `
    <div class="modal-player" id="playerWrap">
      <iframe id="playerFrame"
              src="${embedUrl}"
              allowfullscreen
              allow="autoplay; encrypted-media; picture-in-picture"
              referrerpolicy="no-referrer"
              loading="lazy">
      </iframe>
    </div>
    ${tabsHtml}
    <div class="modal-info-wrap">
      <h2>${title}</h2>
      <p><strong>Chất lượng:</strong> ${quality} · <strong>Thời lượng:</strong> ${duration}</p>
      <p><strong>Thể loại:</strong> ${genres}</p>
      <p style="margin-top:10px">${desc}</p>
    </div>`;

  startIframeWatchdog(embedUrl);
}

function startIframeWatchdog(embedUrl) {
  clearTimeout(iframeLoadTimer);
  let loaded = false;
  const frame = document.getElementById('playerFrame');
  if (frame) frame.addEventListener('load', () => { loaded = true; });

  iframeLoadTimer = setTimeout(() => {
    if (loaded) return;
    const wrap = document.getElementById('playerWrap');
    if (!wrap) return;
    wrap.outerHTML = `
      <div class="player-fallback">
        <div class="icon">🎬</div>
        <h3>Không thể nhúng player</h3>
        <p>Server stream chặn nhúng iframe. Nhấn nút bên dưới để xem trong tab mới.</p>
        <a class="btn-open" href="${embedUrl}" target="_blank" rel="noopener">▶ Mở trong tab mới</a>
      </div>`;
  }, 3500);
}

function switchSource(index) {
  currentSourceIndex = index;
  document.querySelectorAll('.source-tab').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  renderPlayer();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  clearTimeout(iframeLoadTimer);
  const body = document.getElementById('modalBody');
  setTimeout(() => { body.innerHTML = ''; }, 250);
  document.querySelector('.modal').classList.remove('wide');

  // Nếu đang ở view lịch sử, refresh để cập nhật thứ tự
  if (currentView === 'history') renderHistory();
}

document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

============================================ */
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  topBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
});
topBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });/* ============================================

loadPage(1, true);
</script>
