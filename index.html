<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Phim Hay - TopXX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f17;
    color: #fff;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15, 15, 23, 0.95);
    backdrop-filter: blur(10px);
    padding: 14px 20px;
    border-bottom: 1px solid #1f1f2e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, #ff4d6d, #ff9500);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .search-box {
    flex: 1; max-width: 320px;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px;
    background: #1a1a28;
    border: 1px solid #2a2a3e;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border .2s;
  }
  .search-box input:focus { border-color: #ff4d6d; }/* CONTAINER */
.container { padding: 20px; max-width: 1400px; margin: 0 auto; }

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .container { padding: 12px; }
}

/* CARD */
.card {
  background: #1a1a28;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .25s, box-shadow .25s;
  position: relative;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(255, 77, 109, 0.25);
}
.card-img-wrap {
  position: relative;
  aspect-ratio: 2/3;
  background: #25253a;
  overflow: hidden;
}
.card-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .4s;
  display: block;
}
.card-img-wrap img.loaded { opacity: 1; }
.card-img-wrap::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, #1a1a28 0%, #25253a 50%, #1a1a28 100%);
  background-size: 200% 100%;
  animation: skeleton 1.4s infinite;
  z-index: 1;
}
.card-img-wrap.loaded::before { display: none; }
@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}.card-badge {
  position: absolute;
  top: 8px; left: 8px;
  background: rgba(255, 77, 109, 0.9);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  z-index: 2;
}
.card-info { padding: 10px; }
.card-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 34px;
}
.card-meta {
  font-size: 11px;
  color: #888;
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
}
.card-meta .duration { color: #ffb800; font-weight: 600; }

/* LOADER */
.sentinel { height: 40px; margin-top: 20px; }
.loading-more {
  text-align: center;
  padding: 20px;
  color: #888;
  font-size: 14px;
}
.spinner {
  display: inline-block;
  width: 22px; height: 22px;
  border: 3px solid #2a2a3e;
  border-top-color: #ff4d6d;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.end-msg {
  text-align: center;
  padding: 30px;
  color: #555;
  font-size: 14px;
}
.error-box {
  text-align: center;
  padding: 40px 20px;
  color: #ff4d6d;
}
.error-box button {
  margin-top: 16px;
  padding: 10px 24px;
  background: #ff4d6d;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
}  /* TOP BUTTON */
  #topBtn {
    position: fixed;
    bottom: 24px; right: 24px;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #ff4d6d;
    color: #fff;
    border: none;
    font-size: 20px;
    cursor: pointer;
    display: none;
    box-shadow: 0 4px 16px rgba(255, 77, 109, 0.5);
    z-index: 99;
    transition: transform .2s;
  }
  #topBtn:hover { transform: scale(1.1); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1a1a28;
    border-radius: 16px;
    max-width: 800px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
  }
  .modal.wide { max-width: 1000px; }
  .modal-close {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(0,0,0,0.6);
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    z-index: 10;
  }
  .modal-body { display: block; padding: 0; }
  .modal-info-wrap { padding: 16px 20px 20px; }
  .modal-info-wrap h2 { font-size: 20px; margin-bottom: 10px; }
  .modal-info-wrap p { color: #aaa; font-size: 13px; line-height: 1.6; margin-bottom: 6px; }

  /* PLAYER */
  .modal-player {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 16px 16px 0 0;
    overflow: hidden;
    position: relative;
  }
  .modal-player iframe {
    width: 100%; height: 100%;
    border: 0;
    display: block;
  }

  /* TABS SERVER */
  .source-tabs {
    display: flex; gap: 8px;
    padding: 12px 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid #2a2a3e;
    background: #15151f;
  }
  .source-tabs .tab-label {
    color: #888;
    font-size: 13px;
    align-self: center;
    margin-right: 4px;
  }
  .source-tab {
    padding: 6px 14px;
    background: #25253a;
    border: 1px solid #2a2a3e;
    border-radius: 8px;
    color: #ccc;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .source-tab:hover { border-color: #ff4d6d; color: #fff; }
  .source-tab.active {
    background: #ff4d6d;
    border-color: #ff4d6d;
    color: #fff;
    font-weight: 600;
  }

  /* FALLBACK KHI IFRAME BỊ CHẶN */
  .player-fallback {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
    background: #15151f;
    aspect-ratio: 16/9;
    border-radius: 16px 16px 0 0;
  }
  .player-fallback .icon { font-size: 48px; margin-bottom: 16px; }
  .player-fallback h3 { font-size: 18px; margin-bottom: 8px; color: #fff; }
  .player-fallback p { color: #888; font-size: 14px; margin-bottom: 20px; max-width: 420px; }
  .player-fallback .btn-open {
    display: inline-block;
    padding: 12px 32px;
    background: #ff4d6d;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    transition: transform .2s;
  }
  .player-fallback .btn-open:hover { transform: scale(1.05); }

  @media (max-width: 600px) {
    .source-tabs { padding: 10px 14px; }
    .modal-info-wrap { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎬 PHIM HAY</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm phim... (Enter để tìm)">
  </div>
</header>

<div class="container">
  <div id="grid" class="grid"></div>
  <div id="sentinel" class="sentinel"></div>
  <div id="status" class="loading-more"></div>
</div>

<button id="topBtn" title="Lên đầu trang">↑</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div><script>
/* ============================================
   CẤU HÌNH API - topxx.vip (qua CORS proxy)
============================================ */
const API_BASE = 'https://topxx.vip/api/v1/movies/latest';

const PROXIES = [
  (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://cors.eu.org/${url}`,
  (url) => url
];

/* ============================================
   STATE
============================================ */
let currentPage = 1;
let lastPage = 1;
let isLoading = false;
let hasMore = true;
let allMovies = [];
let keyword = '';
const cache = new Map();
let workingProxy = null;

/* ============================================
   HÀM FETCH API (tự thử proxy nếu bị CORS)
============================================ */
async function fetchMovies(page = 1, search = '') {
  const key = `${page}::${search}`;
  if (cache.has(key)) return cache.get(key);

  const params = new URLSearchParams({ page, per_page: 20 });
  if (search) params.append('search', search);
  const targetUrl = `${API_BASE}?${params.toString()}`;

  let proxiesToTry = workingProxy
    ? [workingProxy, ...PROXIES.filter(p => p !== workingProxy)]
    : PROXIES;

  let lastErr = null;
  for (const proxyFn of proxiesToTry) {
    const url = proxyFn(targetUrl);
    try {
      console.log('📡 Thử:', url);
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (!json || typeof json !== 'object') throw new Error('Not JSON');
      if (json.error) throw new Error(json.error);

      workingProxy = proxyFn;
      console.log('✅ Proxy OK');

      const movies = Array.isArray(json?.data) ? json.data : [];
      const meta = json?.meta || {};
      const links = json?.links || {};

      const result = {
        movies,
        currentPage: meta.current_page || page,
        lastPage: meta.last_page || (links.next ? page + 1 : page),
        total: meta.total || 0,
        hasNext: !!links.next
      };
      cache.set(key, result);
      return result;
    } catch (err) {
      console.warn('❌ Proxy fail:', url, err.message);
      lastErr = err;
    }
  }
  throw lastErr || new Error('Tất cả proxy đều thất bại');
}/* ============================================
   RENDER CARD
============================================ */
function createCard(movie) {
  const card = document.createElement('div');
  card.className = 'card';

  const trans    = movie.trans?.[0] || {};
  const title    = trans.title || movie.code || 'Không có tên';
  const poster   = movie.thumbnail || '';
  const quality  = movie.quality || '';
  const duration = movie.duration || '';

  card.innerHTML = `
    <div class="card-img-wrap">
      ${quality ? `<div class="card-badge">${quality}</div>` : ''}
      <img alt="${title}" loading="lazy" decoding="async">
    </div>
    <div class="card-info">
      <div class="card-title">${title}</div>
      <div class="card-meta">
        <span>${duration}</span>
        <span class="duration">${quality}</span>
      </div>
    </div>
  `;

  const img = card.querySelector('img');
  img.onload = () => {
    img.classList.add('loaded');
    img.parentElement.classList.add('loaded');
  };
  img.onerror = () => {
    img.parentElement.classList.add('loaded');
    img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect fill="%2325253a" width="200" height="300"/><text x="50%" y="50%" fill="%23666" font-size="14" text-anchor="middle" dy=".3em">No Image</text></svg>';
  };
  img.src = poster;

  card.onclick = () => openModal(movie);
  return card;
}

/* ============================================
   RENDER GRID
============================================ */
function renderMovies(movies, append = false) {
  const grid = document.getElementById('grid');
  if (!append) grid.innerHTML = '';
  movies.forEach(m => grid.appendChild(createCard(m)));
}/* ============================================
   LOAD TRANG
============================================ */
async function loadPage(page = 1, reset = false) {
  if (isLoading || (!hasMore && !reset)) return;
  isLoading = true;

  const statusEl = document.getElementById('status');
  if (reset) {
    currentPage = 1;
    hasMore = true;
    allMovies = [];
    document.getElementById('grid').innerHTML = '';
  }

  statusEl.innerHTML = '<span class="spinner"></span>Đang tải...';

  try {
    const data = await fetchMovies(page, keyword);
    const movies = data.movies || [];

    if (movies.length === 0 && page === 1) {
      statusEl.innerHTML = `
        <div class="error-box">
          ⚠️ Không có phim nào.<br>
          <small style="color:#888">Thử từ khóa khác hoặc tải lại trang.</small>
        </div>`;
      hasMore = false;
      isLoading = false;
      return;
    }

    renderMovies(movies, !reset);
    allMovies = allMovies.concat(movies);

    lastPage = data.lastPage || 1;
    currentPage = data.currentPage || page;

    if (!data.hasNext || currentPage >= lastPage || movies.length === 0) {
      hasMore = false;
      statusEl.innerHTML = `<div class="end-msg">— Đã hiển thị ${allMovies.length} phim —</div>`;
    } else {
      statusEl.innerHTML = '';
    }
  } catch (err) {
    console.error(err);
    statusEl.innerHTML = `
      <div class="error-box">
        ❌ Lỗi tải dữ liệu: ${err.message}
        <br><button onclick="retry()">Thử lại</button>
      </div>`;
  } finally {
    isLoading = false;
  }
}

function retry() {
  hasMore = true;
  loadPage(currentPage + 1, false);
}/* ============================================
   INFINITE SCROLL
============================================ */
const sentinel = document.getElementById('sentinel');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && hasMore && !isLoading) {
      loadPage(currentPage + 1, false);
    }
  });
}, { rootMargin: '300px' });
observer.observe(sentinel);

/* ============================================
   SEARCH
============================================ */
const searchInput = document.getElementById('searchInput');
let searchTimeout;

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    clearTimeout(searchTimeout);
    keyword = searchInput.value.trim();
    loadPage(1, true);
  }
});

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    const val = searchInput.value.trim();
    if (val !== keyword) {
      keyword = val;
      loadPage(1, true);
    }
  }, 600);
});/* ============================================
   MODAL CHI TIẾT + PLAYER + FALLBACK
============================================ */
let currentMovie = null;
let currentSourceIndex = 0;
let iframeLoadTimer = null;

function openModal(movie) {
  currentMovie = movie;
  currentSourceIndex = 0;
  document.querySelector('.modal').classList.add('wide');
  renderPlayer();
  document.getElementById('modal').classList.add('show');
}

function renderPlayer() {
  const movie = currentMovie;
  if (!movie) return;

  const trans = movie.trans?.[0] || {};
  const title = trans.title || movie.code || 'Không có tên';
  const desc = trans.description || 'Chưa có mô tả.';
  const quality = movie.quality || '—';
  const duration = movie.duration || '—';
  const genres = (movie.genres || [])
    .map(g => g.trans?.[0]?.name)
    .filter(Boolean).join(', ') || '—';

  const sources = movie.sources || [];
  const body = document.getElementById('modalBody');

  if (sources.length === 0) {
    body.innerHTML = `
      <div class="modal-info-wrap" style="padding:40px 20px;text-align:center">
        <h2>${title}</h2>
        <p style="margin-top:16px">${desc}</p>
        <p style="color:#ff4d6d;margin-top:16px">⚠️ Phim này chưa có nguồn phát.</p>
      </div>`;
    return;
  }

  const tabsHtml = sources.length > 1 ? `
    <div class="source-tabs">
      <span class="tab-label">Server:</span>
      ${sources.map((s, i) => `
        <button class="source-tab ${i === currentSourceIndex ? 'active' : ''}"
                onclick="switchSource(${i})">
          ${s.type || 'Server ' + (i + 1)}
        </button>`).join('')}
    </div>` : '';

  const currentSource = sources[currentSourceIndex] || sources[0];
  const embedUrl = currentSource.link || '';

  body.innerHTML = `
    <div class="modal-player" id="playerWrap">
      <iframe id="playerFrame"
              src="${embedUrl}"
              allowfullscreen
              allow="autoplay; encrypted-media; picture-in-picture"
              referrerpolicy="no-referrer"
              loading="lazy">
      </iframe>
    </div>
    ${tabsHtml}
    <div class="modal-info-wrap">
      <h2>${title}</h2>
      <p><strong>Chất lượng:</strong> ${quality} · <strong>Thời lượng:</strong> ${duration}</p>
      <p><strong>Thể loại:</strong> ${genres}</p>
      <p style="margin-top:10px">${desc}</p>
    </div>`;

  startIframeWatchdog(embedUrl);
}

function startIframeWatchdog(embedUrl) {
  clearTimeout(iframeLoadTimer);
  let loaded = false;

  const frame = document.getElementById('playerFrame');
  if (frame) {
    frame.addEventListener('load', () => { loaded = true; });
  }

  iframeLoadTimer = setTimeout(() => {
    if (loaded) return;
    // Sau 3.5s chưa load xong → khả năng bị block, chuyển fallback
    const wrap = document.getElementById('playerWrap');
    if (!wrap) return;
    wrap.outerHTML = `
      <div class="player-fallback">
        <div class="icon">🎬</div>
        <h3>Không thể nhúng player</h3>
        <p>Server stream chặn nhúng iframe. Nhấn nút bên dưới để xem trong tab mới.</p>
        <a class="btn-open" href="${embedUrl}" target="_blank" rel="noopener">▶ Mở trong tab mới</a>
      </div>`;
  }, 3500);
}

function switchSource(index) {
  currentSourceIndex = index;
  document.querySelectorAll('.source-tab').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  renderPlayer();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  clearTimeout(iframeLoadTimer);
  const body = document.getElementById('modalBody');
  setTimeout(() => { body.innerHTML = ''; }, 250);
  document.querySelector('.modal').classList.remove('wide');
}

document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============================================
   BACK TO TOP
============================================ */
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  topBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
});
topBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });/* ============================================
   KHỞI ĐỘNG
============================================ */
console.log('🚀 Web phim TopXX đang chạy...');
loadPage(1, true);
</script>

</body>
</html>
