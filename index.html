<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Phim Hay - HentaiOcean Player</title>
<link rel="preconnect" href="https://api.rss2json.com" crossorigin>
<link rel="preconnect" href="https://corsproxy.io" crossorigin>
<link rel="preconnect" href="https://api.allorigins.win" crossorigin>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f17; color: #fff; min-height: 100vh;
  }
    header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15, 15, 23, 0.95);
    backdrop-filter: blur(10px);
    padding: 12px 20px;
    border-bottom: 1px solid #1f1f2e;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, #ff4d6d, #ff9500);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .nav-tabs { display: flex; gap: 6px; background: #1a1a28; padding: 4px; border-radius: 10px; }
  .nav-tab {
    padding: 8px 14px; background: transparent; border: none;
    color: #aaa; font-size: 13px; font-weight: 600;
    cursor: pointer; border-radius: 8px; transition: all .2s;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .nav-tab:hover { color: #fff; }
  .nav-tab.active { background: #ff4d6d; color: #fff; }
  .nav-tab .badge {
    display: inline-block; min-width: 18px; height: 18px; padding: 0 5px;
    background: rgba(255,255,255,0.25); border-radius: 9px;
    font-size: 10px; font-weight: 700; line-height: 18px; text-align: center;
  }
  .nav-tab.active .badge { background: rgba(255,255,255,0.35); }
  .nav-tab .badge[data-count="0"] { display: none; }
  .search-box { flex: 1; max-width: 380px; margin-left: auto; position: relative; }
  .search-box input {
    width: 100%; padding: 10px 34px 10px 14px;
    background: #1a1a28; border: 1px solid #2a2a3e;
    border-radius: 10px; color: #fff; font-size: 13px; outline: none;
  }
  .search-box input:focus { border-color: #ff4d6d; }
  .search-box .clear-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #888; cursor: pointer;
    font-size: 16px; padding: 4px; display: none;
  }
  .search-box.has-value .clear-btn { display: block; }
  @media (max-width: 600px) {
    .logo { font-size: 16px; }
    .nav-tab { padding: 7px 10px; font-size: 12px; }
    .nav-tab .tab-text { display: none; }
    .nav-tab.active .tab-text { display: inline; }
  }
    .search-info {
    display: none; padding: 12px 0 4px; color: #888; font-size: 14px;
    align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .search-info.show { display: flex; }
  .search-info b { color: #ff4d6d; }
  .search-info button {
    padding: 4px 10px; background: #25253a; border: 1px solid #2a2a3e;
    border-radius: 6px; color: #ccc; cursor: pointer; font-size: 12px;
  }
  .section-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .section-header h2 { font-size: 18px; font-weight: 600; }
  .section-header .clear-history {
    background: #25253a; border: 1px solid #2a2a3e;
    color: #ccc; font-size: 13px; cursor: pointer;
    padding: 6px 14px; border-radius: 8px;
  }
  #historyView { display: none; }
  #historyView.show { display: block; }
  #homeView.hide { display: none; }
  .empty-state { text-align: center; padding: 80px 20px; color: #666; }
  .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .grid, .history-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px;
  }
  @media (max-width: 480px) {
    .grid, .history-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .container { padding: 12px; }
  }
  .card {
    background: #1a1a28; border-radius: 12px; overflow: hidden;
    cursor: pointer; transition: transform .25s, box-shadow .25s; position: relative;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(255, 77, 109, 0.25); }
  .card-img-wrap {
    position: relative; aspect-ratio: 2/3; background: #25253a; overflow: hidden;
  }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; display: block;
  }
  .card-img-wrap img.loaded { opacity: 1; }
  .card-img-wrap::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, #1a1a28 0%, #25253a 50%, #1a1a28 100%);
    background-size: 200% 100%; animation: skeleton 1.4s infinite; z-index: 1;
  }
  .card-img-wrap.loaded::before { display: none; }
  @keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .card-info { padding: 10px; }
  .card-title {
    font-size: 13px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px;
  }
  .card-meta { font-size: 11px; color: #888; margin-top: 6px; display: flex; justify-content: space-between; }
  .sentinel { height: 40px; margin-top: 20px; }
  .loading-more { text-align: center; padding: 20px; color: #888; font-size: 14px; }
  .spinner {
    display: inline-block; width: 22px; height: 22px;
    border: 3px solid #2a2a3e; border-top-color: #ff4d6d;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .end-msg { text-align: center; padding: 30px; color: #555; font-size: 14px; }
  .error-box { text-align: center; padding: 40px 20px; color: #ff4d6d; }
  .error-box button {
    margin-top: 16px; padding: 10px 24px; background: #ff4d6d; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  #topBtn {
    position: fixed; bottom: 24px; right: 24px; width: 46px; height: 46px;
    border-radius: 50%; background: #ff4d6d; color: #fff; border: none;
    font-size: 20px; cursor: pointer; display: none; z-index: 99;
  }
    .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1a1a28; border-radius: 16px; max-width: 800px; width: 100%;
    max-height: 90vh; overflow-y: auto; position: relative;
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6);
    border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; font-size: 20px; z-index: 10;
  }
  .modal-body { display: block; padding: 0; }
  .modal-info-wrap { padding: 16px 20px 20px; }
  .modal-info-wrap h2 { font-size: 18px; margin-bottom: 10px; color: #fff; }
  .modal-info-wrap p { color: #aaa; font-size: 13px; line-height: 1.6; margin-bottom: 6px; }

  .video {
    position: relative; width: 100%; height: 0; padding-bottom: 56.25%;
    background: #000; overflow: hidden; border-radius: 16px 16px 0 0;
  }
  .video iframe, .video video {
    position: absolute; width: 100%; height: 100%; left: 0; top: 0; border: 0; display: block;
  }
  .player-status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #aaa; font-size: 14px; background: #111;
  }
  .source-tabs {
    display: flex; gap: 8px; padding: 12px 20px; flex-wrap: wrap;
    border-bottom: 1px solid #2a2a3e; background: #15151f;
  }
  .source-tabs .tab-label { color: #888; font-size: 13px; align-self: center; margin-right: 4px; }
  .source-tab {
    padding: 6px 14px; background: #25253a; border: 1px solid #2a2a3e;
    border-radius: 8px; color: #ccc; font-size: 13px; cursor: pointer;
  }
  .source-tab:hover { border-color: #ff4d6d; color: #fff; }
  .source-tab.active { background: #ff4d6d; border-color: #ff4d6d; color: #fff; font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="logo">🎬 PHIM HAY</div>
  <nav class="nav-tabs">
    <button class="nav-tab active" data-view="home" onclick="switchView('home')">
      <span>🏠</span><span class="tab-text">Trang chủ</span>
    </button>
    <button class="nav-tab" data-view="history" onclick="switchView('history')">
      <span>🕒</span><span class="tab-text">Lịch sử</span>
      <span class="badge" id="historyBadge" data-count="0">0</span>
    </button>
  </nav>
  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="Tìm tên hoặc dán link watch/slug...">
    <button class="clear-btn" id="clearBtn" title="Xóa">✕</button>
  </div>
</header>

<div class="container">
  <div id="homeView">
    <div class="search-info" id="searchInfo">
      <span>Kết quả cho: <b id="searchKeyword"></b> — <span id="searchCount">0</span> phim</span>
      <button onclick="clearSearch()">Xóa tìm kiếm</button>
    </div>
    <div id="grid" class="grid"></div>
    <div id="sentinel" class="sentinel"></div>
    <div id="status" class="loading-more"></div>
  </div>
  
  <div id="historyView">
    <div class="section-header">
      <h2>🕒 Đã xem gần đây</h2>
      <button class="clear-history" onclick="clearHistory()">Xóa lịch sử</button>
    </div>
    <div class="history-grid" id="historyGrid"></div>
  </div>
</div>

<button id="topBtn" title="Lên đầu trang">↑</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script>
  const RSS_URL = 'https://hentaiocean.com/rss.xml';

  let allMovies = [];
  let filteredMovies = [];
  let currentPage = 1;
  const pageSize = 20;
  let isLoading = false;

  const grid = document.getElementById('grid');
  const sentinel = document.getElementById('sentinel');
  const statusEl = document.getElementById('status');
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const searchBox = document.getElementById('searchBox');
  const searchInfo = document.getElementById('searchInfo');
  const searchKeywordEl = document.getElementById('searchKeyword');
  const searchCountEl = document.getElementById('searchCount');
  const homeView = document.getElementById('homeView');
  const historyView = document.getElementById('historyView');
  const historyGrid = document.getElementById('historyGrid');
  const historyBadge = document.getElementById('historyBadge');
  const topBtn = document.getElementById('topBtn');
  const modal = document.getElementById('modal');
  const modalBody = document.getElementById('modalBody');

  // Hàm tách <hentai-slug> từ liên kết https://hentaiocean.com/watch/<hentai-slug>
  function extractSlug(link) {
    try {
      const url = new URL(link);
      const parts = url.pathname.split('/').filter(Boolean);
      if (parts.includes('watch')) {
        const idx = parts.indexOf('watch');
        return parts[idx + 1] || '';
      }
      return parts[parts.length - 1] || '';
    } catch(e) {
      if (link.includes('/watch/')) {
        return link.split('/watch/')[1].replace(/\//g, '');
      }
      return '';
    }
  }

  // Hàm phát phim trực tiếp khi dán/nhập link watch
  function playFromWatchUrl(watchUrl) {
    const slug = extractSlug(watchUrl);
    if (!slug) return false;

    const movieObj = {
      id: 'watch_' + slug,
      title: `Phim: ${slug.replace(/-/g, ' ')}`,
      link: watchUrl.startsWith('http') ? watchUrl : `https://hentaiocean.com/watch/${slug}`,
      slug: slug,
      embedUrl: `https://hentaiocean.com/embed/${slug}`,
      img: 'https://via.placeholder.com/300x450/1a1a28/ff4d6d?text=' + encodeURIComponent(slug),
      desc: `Phát trực tiếp từ đường dẫn: ${watchUrl}`,
      pubDate: new Date().toLocaleDateString('vi-VN')
    };

    openModal(movieObj);
    return true;
  }

  async function fetchRSS() {
    statusEl.innerHTML = '<span class="spinner"></span> Đang tải danh sách phim...';

    const endpoints = [
      `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`,
      `https://corsproxy.io/?${encodeURIComponent(RSS_URL)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(RSS_URL)}`
    ];

    for (const url of endpoints) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) continue;

        if (url.includes('rss2json.com')) {
          const data = await response.json();
          if (data.status === 'ok' && data.items && data.items.length > 0) {
            parseJSONData(data.items);
            return;
          }
        } else {
          const text = await response.text();
          if (text && (text.includes('<rss') || text.includes('<item'))) {
            parseAndRenderRSS(text);
            return;
          }
        }
      } catch (e) {
        console.warn('Endpoint error:', url, e);
      }
    }

    statusEl.innerHTML = `
      <div class="error-box">
        ⚠️ Không thể kết nối máy chủ.<br>
        <small style="color:#aaa;">Vui lòng bật 1.1.1.1 (WARP) hoặc chạy ứng dụng trên local server (Acode/TrebEdit).</small><br>
        <button onclick="fetchRSS()">Thử lại</button>
      </div>
    `;
  }
   function parseJSONData(items) {
    allMovies = items.map((item, index) => {
      let img = item.thumbnail || (item.enclosure && item.enclosure.link) || '';
      if (!img && item.description) {
        const match = item.description.match(/src=["']([^"']+)["']/i);
        if (match) img = match[1];
      }

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = item.description || '';

      const link = item.link || '#';
      const slug = extractSlug(link);

      return {
        id: item.guid || link || index.toString(),
        title: item.title || 'Phim mới',
        link: link,
        slug: slug,
        embedUrl: link.includes('/watch/') ? link.replace('/watch/', '/embed/') : `https://hentaiocean.com/embed/${slug}`,
        img: img || 'https://via.placeholder.com/300x450/1a1a28/888888?text=No+Cover',
        desc: tempDiv.textContent || tempDiv.innerText || '',
        pubDate: item.pubDate ? new Date(item.pubDate).toLocaleDateString('vi-VN') : ''
      };
    });

    filteredMovies = [...allMovies];
    currentPage = 1;
    grid.innerHTML = '';
    renderNextPage();
    setupIntersectionObserver();
  }

  function parseAndRenderRSS(xmlText) {
    try {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
      const items = Array.from(xmlDoc.querySelectorAll('item'));

      if (items.length === 0) {
        statusEl.innerHTML = '<div class="end-msg">Không tìm thấy phim.</div>';
        return;
      }

      allMovies = items.map((item, index) => {
        const title = item.querySelector('title')?.textContent?.trim() || 'Phim mới';
        const link = item.querySelector('link')?.textContent?.trim() || '#';
        const guid = item.querySelector('guid')?.textContent?.trim() || link || index.toString();
        const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';

        let description = item.querySelector('description')?.textContent?.trim() || '';
        let img = item.querySelector('media\\:thumbnail, thumbnail')?.getAttribute('url') || 
                  item.querySelector('enclosure')?.getAttribute('url') || '';

        if (!img && description) {
          const imgMatch = description.match(/src=["']([^"']+)["']/i);
          if (imgMatch) img = imgMatch[1];
        }

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = description;
        const slug = extractSlug(link);

        return {
          id: guid,
          title,
          link,
          slug: slug,
          embedUrl: link.includes('/watch/') ? link.replace('/watch/', '/embed/') : `https://hentaiocean.com/embed/${slug}`,
          img: img || 'https://via.placeholder.com/300x450/1a1a28/888888?text=No+Cover',
          desc: tempDiv.textContent || tempDiv.innerText || '',
          pubDate: pubDate ? new Date(pubDate).toLocaleDateString('vi-VN') : ''
        };
      });

      filteredMovies = [...allMovies];
      currentPage = 1;
      grid.innerHTML = '';
      renderNextPage();
      setupIntersectionObserver();
    } catch (err) {
      statusEl.innerHTML = `<div class="error-box">Lỗi xử lý XML.<br><button onclick="fetchRSS()">Thử lại</button></div>`;
    }
  }
   function renderNextPage() {
    if (isLoading) return;
    isLoading = true;

    const start = (currentPage - 1) * pageSize;
    const end = currentPage * pageSize;
    const pageItems = filteredMovies.slice(start, end);

    if (pageItems.length === 0 && currentPage === 1) {
      grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="icon">🔍</div><h3>Không tìm thấy phim</h3></div>`;
      statusEl.innerHTML = '';
      isLoading = false;
      return;
    }

    pageItems.forEach(movie => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openModal(movie);

      card.innerHTML = `
        <div class="card-img-wrap">
          <img data-src="${escapeHtml(movie.img)}" alt="${escapeHtml(movie.title)}" 
               onload="this.classList.add('loaded'); this.parentElement.classList.add('loaded');" 
               onerror="this.src='https://via.placeholder.com/300x450/1a1a28/888888?text=Error'; this.classList.add('loaded');">
        </div>
        <div class="card-info">
          <div class="card-title" title="${escapeHtml(movie.title)}">${escapeHtml(movie.title)}</div>
          <div class="card-meta"><span>${movie.pubDate || 'HentaiOcean'}</span></div>
        </div>
      `;
      grid.appendChild(card);
    });

    lazyLoadImages();

    if (end >= filteredMovies.length) {
      statusEl.innerHTML = '<div class="end-msg">🎉 Đã tải xong tất cả phim!</div>';
    } else {
      statusEl.innerHTML = '';
      currentPage++;
    }

    isLoading = false;
  }

  function lazyLoadImages() {
    const imgs = document.querySelectorAll('img[data-src]');
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.getAttribute('data-src');
          img.removeAttribute('data-src');
          obs.unobserve(img);
        }
      });
    }, { rootMargin: '100px' });

    imgs.forEach(img => observer.observe(img));
  }

  function setupIntersectionObserver() {
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isLoading && (currentPage - 1) * pageSize < filteredMovies.length) {
        renderNextPage();
      }
    }, { rootMargin: '200px' });

    observer.observe(sentinel);
  }
    async function loadVideoFromAPI(slug, movie) {
    const apiUrl = `https://hentaiocean.com/api?action=hentai&slug=${encodeURIComponent(slug)}`;
    let apiData = null;

    const proxyUrls = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`,
      `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`
    ];

    for (const pUrl of proxyUrls) {
      try {
        const res = await fetch(pUrl);
        if (res.ok) {
          apiData = await res.json();
          if (apiData) break;
        }
      } catch (e) {
        console.warn('Proxy API error...', e);
      }
    }

    const playerContainer = document.getElementById('playerContainer');
    const sourceTabs = document.getElementById('sourceTabs');

    if (apiData) {
      const streamUrl = apiData.stream || apiData.embed || apiData.iframe || apiData.url || apiData.video;
      if (streamUrl) {
        if (typeof streamUrl === 'string' && streamUrl.includes('<iframe')) {
          playerContainer.innerHTML = streamUrl;
        } else {
          playerContainer.innerHTML = `<iframe src="${escapeHtml(streamUrl)}" allowfullscreen frameborder="0"></iframe>`;
        }
        sourceTabs.innerHTML = `
          <span class="tab-label">Nguồn:</span>
          <button class="source-tab active" onclick="switchPlayerSource(this, '${escapeHtml(streamUrl)}')">Server API</button>
          <button class="source-tab" onclick="switchPlayerSource(this, '${escapeHtml(movie.embedUrl)}')">Server Embed</button>
          <button class="source-tab" onclick="switchPlayerSource(this, '${escapeHtml(movie.link)}')">Web Gốc</button>
        `;
        return;
      }
    }

    playerContainer.innerHTML = `<iframe src="${escapeHtml(movie.embedUrl)}" allowfullscreen frameborder="0"></iframe>`;
    sourceTabs.innerHTML = `
      <span class="tab-label">Nguồn:</span>
      <button class="source-tab active" onclick="switchPlayerSource(this, '${escapeHtml(movie.embedUrl)}')">Server Embed</button>
      <button class="source-tab" onclick="switchPlayerSource(this, '${escapeHtml(movie.link)}')">Web Gốc</button>
    `;
  }

  async function openModal(movie) {
    addToHistory(movie);

    modalBody.innerHTML = `
      <div class="video" id="playerContainer">
        <div class="player-status"><span class="spinner"></span> Đang tải player...</div>
      </div>
      <div class="source-tabs" id="sourceTabs"></div>
      <div class="modal-info-wrap">
        <h2>${escapeHtml(movie.title)}</h2>
        ${movie.desc ? `<p>${escapeHtml(movie.desc)}</p>` : ''}
        <p style="margin-top: 10px;">
          <a href="${escapeHtml(movie.link)}" target="_blank" rel="noopener" style="color:#ff4d6d; text-decoration:none; font-weight:600;">
            🔗 Mở trang phim gốc ↗
          </a>
        </p>
      </div>
    `;

    modal.classList.add('show');
    document.body.style.overflow = 'hidden';

    if (movie.slug) {
      await loadVideoFromAPI(movie.slug, movie);
    } else {
      document.getElementById('playerContainer').innerHTML = `<iframe src="${escapeHtml(movie.embedUrl)}" allowfullscreen frameborder="0"></iframe>`;
    }
  }

  function switchPlayerSource(btn, url) {
    document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const iframe = modalBody.querySelector('iframe');
    if (iframe) iframe.src = url;
  }

  function closeModal() {
    modal.classList.remove('show');
    modalBody.innerHTML = '';
    document.body.style.overflow = '';
  }
    searchInput.addEventListener('input', (e) => {
    const query = e.target.value.trim();
    searchBox.classList.toggle('has-value', query.length > 0);

    // Nếu người dùng dán hoặc nhập đường dẫn watch/slug
    if (query.includes('hentaiocean.com/watch/') || query.includes('/watch/')) {
      if (playFromWatchUrl(query)) {
        clearSearch();
        return;
      }
    }

    handleSearch(query);
  });

  clearBtn.addEventListener('click', clearSearch);

  function handleSearch(query) {
    const key = query.toLowerCase();
    if (!key) {
      searchInfo.classList.remove('show');
      filteredMovies = [...allMovies];
    } else {
      filteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(key) || m.slug.toLowerCase().includes(key));
      searchKeywordEl.textContent = query;
      searchCountEl.textContent = filteredMovies.length;
      searchInfo.classList.add('show');
    }
    currentPage = 1;
    grid.innerHTML = '';
    renderNextPage();
  }

  function clearSearch() {
    searchInput.value = '';
    searchBox.classList.remove('has-value');
    handleSearch('');
  }

  function switchView(view) {
    document.querySelectorAll('.nav-tab').forEach(t => {
      t.classList.toggle('active', t.getAttribute('data-view') === view);
    });

    if (view === 'home') {
      homeView.classList.remove('hide');
      historyView.classList.remove('show');
    } else {
      homeView.classList.add('hide');
      historyView.classList.add('show');
      renderHistory();
    }
  }

  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem('watched_history') || '[]');
    } catch (e) {
      return [];
    }
  }

  function addToHistory(movie) {
    let history = getHistory().filter(item => item.id !== movie.id);
    history.unshift({ ...movie, watchedAt: new Date().toLocaleDateString('vi-VN') });
    if (history.length > 50) history.pop();
    localStorage.setItem('watched_history', JSON.stringify(history));
    updateHistoryBadge();
  }

  function updateHistoryBadge() {
    const history = getHistory();
    historyBadge.setAttribute('data-count', history.length);
    historyBadge.textContent = history.length;
  }

  function renderHistory() {
    const history = getHistory();
    if (history.length === 0) {
      historyGrid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="icon">🕒</div><h3>Chưa có lịch sử xem</h3></div>`;
      return;
    }

    historyGrid.innerHTML = '';
    history.forEach(movie => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openModal(movie);
      card.innerHTML = `
        <div class="card-img-wrap loaded">
          <img src="${escapeHtml(movie.img)}" class="loaded" alt="${escapeHtml(movie.title)}">
        </div>
        <div class="card-info">
          <div class="card-title">${escapeHtml(movie.title)}</div>
          <div class="card-meta"><span>${movie.watchedAt}</span></div>
        </div>
      `;
      historyGrid.appendChild(card);
    });
  }

  function clearHistory() {
    if (confirm('Xóa tất cả lịch sử xem phim?')) {
      localStorage.removeItem('watched_history');
      updateHistoryBadge();
      renderHistory();
    }
  }

  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(); });
  window.addEventListener('scroll', () => { topBtn.style.display = window.scrollY > 300 ? 'block' : 'none'; });
  topBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateHistoryBadge();
    fetchRSS();
  });
</script>

</body>
</html>
